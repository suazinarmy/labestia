<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Juanpa Pelado</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#ffd84d;--text:#e6eef8}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;color:var(--text);background:linear-gradient(180deg,#07101a 0%, #0b1a2a 100%);}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{width:360px;max-width:92vw;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);padding:20px;text-align:center}
    h1{margin:0 0 12px;font-size:20px;letter-spacing:0.6px}
    .btn{appearance:none;border:0;background:var(--accent);color:#07101a;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
    .btn:active{transform:translateY(1px)}
    .message{margin-top:14px;font-size:18px;font-weight:700}
    .photo{display:block;margin:18px auto 6px;max-width:100%;height:auto;border-radius:12px;border:6px solid rgba(255,255,255,0.04);box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    .hidden{display:none}
    .spin{animation: spin 1.2s linear infinite;transform-origin:50% 50%}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .hint{margin-top:10px;font-size:12px;opacity:0.7}
    @media (min-width:600px){.card{width:420px;padding:28px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Mini web — Haz click</h1>
      <button id="trigger" class="btn">Mostrar</button>
      <div id="message" class="message hidden">Juanpa Pelado</div>
      <img id="photo" class="photo hidden" src="unnamed.jpg" alt="Foto de Juanpa Pelado">
      <div class="hint">La imagen girará en círculo al hacer click.</div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('trigger');
    const msg = document.getElementById('message');
    const img = document.getElementById('photo');

    btn.addEventListener('click', () => {
      // Mostrar texto e imagen y aplicar giro
      msg.classList.remove('hidden');
      img.classList.remove('hidden');
      // Forzar "reflow" antes de añadir la clase para asegurar que la animación comience
      void img.offsetWidth;
      img.classList.add('spin');
      // Opcional: deshabilitar botón para evitar múltiples clicks
      btn.disabled = true;
      btn.textContent = 'Mostrado';
    });
  </script>
</body>
</html>
